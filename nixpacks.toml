[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.openssl", "php82Extensions.intl", "php82Extensions.sodium", "composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
  "php bin/console cache:clear --env=prod --no-debug",
  "php bin/console cache:warmup --env=prod --no-debug"
]

[start]
cmd = "php -S 0.0.0.0:$PORT -t public/"
